name: HuHuVibe
options:
  minimumXcodeGenVersion: 2.42.0
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.2"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HuHuVibe:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Assets/Viewer.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HUHU_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: Config/HuHuVibe.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: 乎乎 Vibe
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: true
        HuHuAPIHost: $(HUHU_API_HOST)
        HuHuAPNsEnvironment: $(HUHU_APNS_ENVIRONMENT)
        CFBundleURLTypes:
          - CFBundleURLName: $(HUHU_BUNDLE_ID).invitation
            CFBundleURLSchemes: [huhuvibe]
    dependencies:
      - target: HuHuLiveActivity
        embed: true
  HuHuLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - Assets/LiveActivity.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HUHU_BUNDLE_ID).LiveActivity
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: 乎乎 Vibe
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  HuHuVibe:
    build:
      targets:
        HuHuVibe: all
    run:
      config: Debug
    archive:
      config: Release
